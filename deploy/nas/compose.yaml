services:
  codex-entry:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ENTRY_PORT:-18787}:8080"
    environment:
      GATEWAY_UPSTREAM: "${GATEWAY_UPSTREAM:?제발 .env 컴퓨터의 LAN을 입력하세요 IP 및 게이트웨이 포트}"
      NGINX_ENVSUBST_FILTER: '^GATEWAY_UPSTREAM$'
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
